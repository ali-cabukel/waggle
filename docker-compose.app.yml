# Backend API (:8000) + Next.js frontend (:3000).
# Includes the base DB stack (Mongo, Redis, Obscura).
#
#   docker compose -f docker-compose.app.yml up --build
#
# Opens:
#   Frontend  → http://localhost:3000
#   API       → http://localhost:8000
#   Health    → http://localhost:8000/health

include:
  - path: docker-compose.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-waggle}
      REDIS_URL: redis://redis:6379/0
      OBSCURA_CDP_URL: http://obscura:9222
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001"]'
      PLAYWRIGHT_HEADLESS: "true"
      JOB_BACKEND: ${JOB_BACKEND:-asyncio}
      WAGGLE_API_KEY: ${WAGGLE_API_KEY:-waggle-dev-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      obscura:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws/chat}
        NEXT_PUBLIC_WAGGLE_API_KEY: ${NEXT_PUBLIC_WAGGLE_API_KEY:-waggle-dev-key}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/ws/chat}
      NEXT_PUBLIC_WAGGLE_API_KEY: ${NEXT_PUBLIC_WAGGLE_API_KEY:-waggle-dev-key}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
